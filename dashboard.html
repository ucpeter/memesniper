<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>MEME SNIPER — Multi-Wallet Solana Sniper</title>
<style>
/* ============================================================
   MEME SNIPER — dashboard styles
   Self-contained: no CDN, no external fonts, no network calls.
   ============================================================ */

:root {
  --bg:        #08090b;
  --panel:     #0d0f13;
  --panel-2:   #11141a;
  --elev:      #161a21;
  --border:    #1e242d;
  --border-hi: #2b333f;

  --text:      #e8eef5;
  --text-dim:  #9aa5b3;
  --text-mute: #5d6875;

  --accent:    #00ff66;
  --accent-dk: #00c44e;
  --red:       #ff4d5e;
  --amber:     #ffb020;
  --blue:      #4d9fff;
  --purple:    #a97bff;

  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --r-sm: 6px;
  --r:    10px;
  --r-lg: 14px;

  --shadow: 0 4px 24px rgba(0,0,0,.45);
  --glow:   0 0 24px rgba(0,255,102,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(900px 500px at 12% -8%, rgba(0,255,102,.06), transparent 60%),
    radial-gradient(700px 400px at 92% 0%, rgba(77,159,255,.05), transparent 60%);
  background-attachment: fixed;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #3a4453; }

.mono { font-family: var(--mono); }
.pos  { color: var(--accent); }
.neg  { color: var(--red); }
.dim  { color: var(--text-dim); }
.mute { color: var(--text-mute); }

/* ----------------------------- top bar ----------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 18px;
  padding: 0 20px; height: 60px;
  background: rgba(8,9,11,.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.4px; font-size: 17px; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dk));
  display: grid; place-items: center;
  color: #04140a; font-weight: 900; font-size: 15px;
  box-shadow: var(--glow);
}
.brand-sub { color: var(--text-mute); font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; }

.topbar-spacer { flex: 1; }

.mode-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  border: 1px solid var(--border-hi);
  background: var(--panel-2);
}
.mode-chip.dry   { color: var(--amber); border-color: rgba(255,176,32,.28); background: rgba(255,176,32,.07); }
.mode-chip.live  { color: var(--red); border-color: rgba(255,77,94,.32); background: rgba(255,77,94,.08); }
.mode-chip .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .28; } }

.run-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700;
  letter-spacing: .6px; text-transform: uppercase;
  border: 1px solid var(--border-hi); background: var(--panel-2); color: var(--text-dim);
}
.run-chip.on { color: var(--accent); border-color: rgba(0,255,102,.3); background: rgba(0,255,102,.07); }
.run-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ----------------------------- buttons ----------------------------- */
.btn {
  appearance: none; border: 1px solid var(--border-hi); background: var(--elev);
  color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 8px 15px; border-radius: var(--r-sm); cursor: pointer;
  transition: background .14s, border-color .14s, transform .08s, color .14s;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
}
.btn:hover { background: #1c2129; border-color: #39424f; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn-primary { background: linear-gradient(180deg, var(--accent), var(--accent-dk)); color: #04140a; border-color: transparent; font-weight: 800; }
.btn-primary:hover { filter: brightness(1.1); background: linear-gradient(180deg, var(--accent), var(--accent-dk)); }
.btn-danger  { background: rgba(255,77,94,.11); color: var(--red); border-color: rgba(255,77,94,.32); }
.btn-danger:hover { background: rgba(255,77,94,.19); }
.btn-warn    { background: rgba(255,176,32,.11); color: var(--amber); border-color: rgba(255,176,32,.32); }
.btn-warn:hover { background: rgba(255,176,32,.19); }
.btn-ghost   { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { background: var(--elev); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 7px 9px; }

/* ----------------------------- layout ----------------------------- */
.wrap { display: grid; grid-template-columns: 1fr 372px; gap: 16px; padding: 16px 20px 40px; max-width: 1800px; margin: 0 auto; align-items: start; }
@media (max-width: 1180px) { .wrap { grid-template-columns: 1fr; } }

.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ----------------------------- panels ----------------------------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,.018), transparent);
}
.panel-title { font-size: 13px; font-weight: 700; letter-spacing: .2px; }
.panel-title .count {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--text-mute); background: var(--panel-2);
  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
  margin-left: 7px;
}
.panel-body { padding: 16px; }
.panel-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ----------------------------- stat grid ----------------------------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr)); gap: 12px; }
.stat {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 15px;
  position: relative; overflow: hidden;
}
.stat::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--border-hi); }
.stat.accent::before { background: var(--accent); }
.stat.red::before { background: var(--red); }
.stat.blue::before { background: var(--blue); }
.stat.amber::before { background: var(--amber); }
.stat-label { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 6px; }
.stat-value { font-family: var(--mono); font-size: 21px; font-weight: 600; letter-spacing: -.6px; line-height: 1.15; }
.stat-sub { font-size: 11px; color: var(--text-mute); margin-top: 3px; font-family: var(--mono); }

/* ----------------------------- wallet cards ----------------------------- */
.wallets { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

.wallet {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 15px; position: relative;
  transition: border-color .16s, box-shadow .16s;
}
.wallet:hover { border-color: var(--border-hi); }
.wallet.enabled { border-color: rgba(0,255,102,.22); }
.wallet.enabled::after { content: ''; position: absolute; top: 15px; right: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.wallet.paused { border-color: rgba(255,176,32,.3); }
.wallet.paused::after { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.wallet.off::after { background: var(--text-mute); box-shadow: none; }

.wallet-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.wallet-name { font-weight: 700; font-size: 14.5px; letter-spacing: -.2px; }
.wallet-addr { font-family: var(--mono); font-size: 10.5px; color: var(--text-mute); margin-top: 2px; }
.wallet-preset {
  font-size: 10px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase;
  padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border-hi);
  color: var(--text-dim); background: var(--panel-2);
}

.wallet-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 13px; }
.wstat { background: var(--panel-2); border-radius: var(--r-sm); padding: 8px 10px; border: 1px solid var(--border); }
.wstat-k { font-size: 9.5px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--text-mute); }
.wstat-v { font-family: var(--mono); font-size: 14px; font-weight: 600; margin-top: 2px; }

.tier-track { display: flex; gap: 5px; align-items: center; margin-bottom: 12px; }
.tier-pip {
  flex: 1; height: 4px; border-radius: 2px; background: var(--border-hi);
  position: relative; transition: background .2s;
}
.tier-pip.filled { background: var(--accent); box-shadow: 0 0 8px rgba(0,255,102,.4); }
.tier-legend { display: flex; gap: 10px; font-size: 10px; color: var(--text-mute); font-family: var(--mono); margin-bottom: 12px; }

.wallet-actions { display: flex; gap: 7px; flex-wrap: wrap; }

/* ----------------------------- table ----------------------------- */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  text-align: left; padding: 9px 12px; font-size: 10px; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase; color: var(--text-mute);
  border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--panel-2);
}
tbody td { padding: 10px 12px; border-bottom: 1px solid rgba(30,36,45,.6); font-family: var(--mono); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,.017); }
td.sym { font-weight: 700; font-family: var(--sans); font-size: 13px; }
td.num { text-align: right; }
th.num { text-align: right; }

.badge {
  display: inline-block; padding: 2px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  font-family: var(--sans);
}
.badge.open   { background: rgba(77,159,255,.13); color: var(--blue); }
.badge.won    { background: rgba(0,255,102,.12); color: var(--accent); }
.badge.lost   { background: rgba(255,77,94,.13); color: var(--red); }
.badge.sim    { background: rgba(169,123,255,.13); color: var(--purple); }

/* ----------------------------- stop gauge ----------------------------- */
.gauge { width: 92px; height: 5px; background: var(--border-hi); border-radius: 3px; position: relative; overflow: hidden; display: inline-block; vertical-align: middle; }
.gauge-fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; transition: width .3s, background .3s; }
.gauge-fill.neg { background: var(--red); }
.gauge-mark { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--amber); }

/* ----------------------------- log console ----------------------------- */
.console {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.65;
  height: 340px; overflow-y: auto; padding: 10px 13px;
  background: #06070a; border-radius: var(--r); border: 1px solid var(--border);
}
.logline { display: flex; gap: 9px; padding: 1px 0; }
.logline .t { color: var(--text-mute); flex-shrink: 0; }
.logline .w { color: var(--purple); flex-shrink: 0; }
.logline .m { flex: 1; word-break: break-word; }
.logline.info  .m { color: var(--text-dim); }
.logline.trade .m { color: var(--accent); }
.logline.warn  .m { color: var(--amber); }
.logline.error .m { color: var(--red); }
.logline.debug .m { color: var(--text-mute); }

/* ----------------------------- modal ----------------------------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(3,4,6,.78);
  backdrop-filter: blur(5px); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fade .16s ease;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--panel); border: 1px solid var(--border-hi);
  border-radius: var(--r-lg); width: 100%; max-width: 780px;
  max-height: 90vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow); animation: rise .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes rise { from { transform: translateY(14px) scale(.98); opacity: 0; } }
.modal-head { display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.modal-foot { display: flex; gap: 9px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }

/* ----------------------------- tabs ----------------------------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab {
  padding: 9px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-mute);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  background: none; border-top: none; border-left: none; border-right: none; font-family: inherit;
  transition: color .14s, border-color .14s;
}
.tab:hover { color: var(--text-dim); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabpane { display: none; }
.tabpane.active { display: block; animation: fade .16s; }

/* ----------------------------- forms ----------------------------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
.field .hint { font-size: 11px; color: var(--text-mute); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border-hi);
  color: var(--text); font-family: var(--mono); font-size: 13px;
  padding: 9px 11px; border-radius: var(--r-sm); outline: none;
  transition: border-color .14s, box-shadow .14s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,102,.09); }
select { cursor: pointer; font-family: var(--sans); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

.switch { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-sm); cursor: pointer; }
.switch span { font-size: 12.5px; font-weight: 600; }
.switch .desc { font-size: 10.5px; color: var(--text-mute); font-weight: 400; display: block; }

/* ----------------------------- tier editor ----------------------------- */
.tier-row {
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 11px; margin-bottom: 9px;
}
.tier-row .rm { margin-bottom: 1px; }

.section-label {
  font-size: 10.5px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase;
  color: var(--text-mute); margin: 20px 0 11px; padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
}
.section-label:first-child { margin-top: 0; }

/* ----------------------------- empty/notice ----------------------------- */
.empty { text-align: center; padding: 40px 20px; color: var(--text-mute); }
.empty-icon { font-size: 30px; margin-bottom: 10px; opacity: .5; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 4px; }
.empty-sub { font-size: 12px; }

.notice {
  display: flex; gap: 11px; padding: 12px 14px; border-radius: var(--r);
  font-size: 12.5px; line-height: 1.5; margin-bottom: 16px;
  border: 1px solid; align-items: flex-start;
}
.notice.warn  { background: rgba(255,176,32,.07); border-color: rgba(255,176,32,.26); color: #ffd88a; }
.notice.danger{ background: rgba(255,77,94,.07);  border-color: rgba(255,77,94,.26);  color: #ffb3bb; }
.notice.info  { background: rgba(77,159,255,.07); border-color: rgba(77,159,255,.24); color: #b3d4ff; }
.notice .ico { flex-shrink: 0; font-weight: 800; }

/* ----------------------------- misc ----------------------------- */
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border-hi); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 9px; }
.toast {
  background: var(--elev); border: 1px solid var(--border-hi); border-left: 3px solid var(--accent);
  padding: 11px 15px; border-radius: var(--r-sm); font-size: 12.5px; min-width: 240px;
  box-shadow: var(--shadow); animation: slideIn .22s cubic-bezier(.2,.9,.3,1);
}
.toast.err { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } }

/* Marks a dry-run / notional figure so paper money is never mistaken for real. */
.paper-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 9px;
  letter-spacing: 0.08em;
  vertical-align: middle;
  color: #ffd479;
  background: rgba(255, 212, 121, 0.12);
  border: 1px solid rgba(255, 212, 121, 0.35);
}

/* ------------------------------ Fund a wallet ------------------------------ */
/* A Solana wallet has no "fund" button — you send SOL to its address. This
   makes that address copyable and states the amount that is actually needed. */
.addr-btn {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--text-mute, #8b93a7);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.addr-btn:hover { color: var(--accent, #6ee7ff); }
.addr-cta {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid currentColor;
  opacity: 0.75;
}

.fl-label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mute, #8b93a7);
  margin: 16px 0 6px;
}

.addr-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.addr-box code {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 12.5px;
  color: #e8ecf5;
}

.fund-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.fund-grid > div {
  padding: 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.fg-k { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mute, #8b93a7); }
.fg-v { font-size: 16px; font-weight: 600; margin-top: 3px; }

.fund-suggest {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px;
  border-radius: 8px;
  background: rgba(110, 231, 255, 0.07);
  border: 1px solid rgba(110, 231, 255, 0.22);
}
.fund-suggest b { font-size: 20px; }
.fund-suggest .muted { font-size: 12px; }

.fund-how { margin-top: 14px; }
.fund-how summary {
  cursor: pointer;
  font-size: 12.5px;
  color: var(--accent, #6ee7ff);
  padding: 6px 0;
}
.fund-how ol { margin: 8px 0 0 18px; padding: 0; font-size: 12.5px; line-height: 1.7; }
.fund-how .muted { font-size: 12px; margin-top: 8px; }

/* --------------------- Connected wallet (funding) --------------------- */
.wsol-connected {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(110, 231, 255, 0.06);
  border: 1px solid rgba(110, 231, 255, 0.2);
}
.wsol-name { font-weight: 600; font-size: 13px; }
.wsol-addr { font-size: 11px; color: var(--text-mute, #8b93a7); overflow-wrap: anywhere; }
.wsol-pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.row-flex { display: flex; align-items: center; gap: 8px; }
.row-flex .inp { flex: 1; min-width: 0; }
.row-flex .unit { font-size: 12px; color: var(--text-mute, #8b93a7); }

/* ----------------------------- Withdraw ----------------------------- */

.wd-rows {

.wd-rows > div {

  border: 1px solid rgba(255, 212, 121, 0.28);

/* ===================================================================== *
 * Phone / narrow viewport
 * ===================================================================== *
 * Without this the dashboard overflows horizontally on a phone: wallet cards
 * clip their preset badge, the action buttons run off the edge, and modal
 * content is cut off mid-word.
 */
html, body { max-width: 100%; overflow-x: hidden; }
.wallet, .panel, .stat { min-width: 0; }
.wallet-name, .wallet-addr, .wstat-v { min-width: 0; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .wrap { padding: 10px !important; gap: 12px !important; }

  /* Header: let the action buttons wrap under the title instead of clipping. */
  .panel-head { flex-wrap: wrap; row-gap: 8px; }
  .panel-head .panel-actions, .panel-actions { flex-wrap: wrap; }

  /* Wallet cards: 2-up stats, wrapping actions, preset badge on its own line. */
  .wallet-top { flex-wrap: wrap; }
  .wallet-preset { margin-left: 0; }
  .wallet-stats { grid-template-columns: repeat(2, 1fr) !important; }
  .wallet-actions { gap: 6px; }
  .wallet-actions .btn { flex: 1 1 auto; min-width: 88px; justify-content: center; }

  /* Modals: near-full-screen, comfortable padding, everything reachable. */
  .modal-bg { padding: 8px; align-items: flex-start; }
  .modal { max-width: 100% !important; max-height: 94vh; }
  .modal-head { padding: 13px 14px; gap: 10px; }
  .modal-body { padding: 14px; }
  .modal-foot {
    padding: 12px 14px; flex-wrap: wrap;
    border-radius: 0 0 var(--r-lg) var(--r-lg);
  }
  .modal-foot .btn { flex: 1 1 auto; min-width: 120px; justify-content: center; }

  /* Tabs must stay reachable rather than being cut off. */
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { white-space: nowrap; flex: 0 0 auto; }

  /* Tables scroll inside their own container instead of widening the page. */
  table { min-width: 520px; }
  .panel-body, .table-scroll { overflow-x: auto; }

  .stats { grid-template-columns: repeat(2, 1fr) !important; }
  .grid2, .grid3 { grid-template-columns: 1fr !important; }
  .fund-grid { grid-template-columns: 1fr !important; }
  .addr-box { flex-wrap: wrap; }
  .addr-box code { flex: 1 1 100%; }

  /* Toasts span the screen instead of hanging off the right edge. */
  .toast-wrap { left: 10px; right: 10px; bottom: 10px; }
  .toast { max-width: 100%; }
}

@media (max-width: 420px) {
  .wallet-stats { grid-template-columns: 1fr !important; }
  .stats { grid-template-columns: 1fr !important; }
  .modal-foot .btn { min-width: 100%; }
}

/* ---------------------- Burner-wallet framing ---------------------- */
.burner-intro {
  display: flex;

  align-items: flex-start;
  padding: 13px;
  border-radius: 10px;
  background: rgba(255, 138, 76, 0.07);
  border: 1px solid rgba(255, 138, 76, 0.26);

.burner-badge {

  padding: 1px 6px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.07em;
  vertical-align: middle;
  color: #ff8a4c;
  background: rgba(255, 138, 76, 0.12);
  border: 1px solid rgba(255, 138, 76, 0.34);
}

.import-key { margin-top: 16px; }
.import-key summary {

}

.imported-badge {
  display: inline-block;
  margin-left: 7px;
  padding: 1px 6px;

  font-weight: 700;

  color: #ffd479;
  background: rgba(255, 212, 121, 0.12);
  border: 1px solid rgba(255, 212, 121, 0.34);
}

/* Side-by-side min/max so a liquidity RANGE reads as one control, not two
   unrelated fields. */
.range-row { display: flex; align-items: center; gap: 8px; }
.range-row input { flex: 1; min-width: 0; }
.range-sep { font-size: 11px; color: var(--text-mute, #8b93a7); flex: 0 0 auto; }

/* --------------------------- Fund button --------------------------- */
/* Replaces the old clickable-address affordance. Funding is a connect-and-sign
   flow now, so the card offers an action rather than an address to copy. */

  border-color: rgba(124, 252, 154, 0.35);
  background: rgba(124, 252, 154, 0.08);
}

/* ---------------------- Header connect button ---------------------- */

}

<script>
/* ============================================================
   MEME SNIPER dashboard
   Talks to the local API over same-origin HTTP + WebSocket.
   Falls back to a self-contained DEMO mode when no backend is
   reachable (e.g. viewing the file standalone), so the UI is
   always inspectable.
   ============================================================ */
'use strict';

/* ------------------------------- state ------------------------------- */
const S = {
  token: null,
  connected: false,
  ws: null,
  demo: false,
  status: null,
  wallets: [],
  positions: [],
  prices: {},
  logs: [],
  config: null,
  presets: {},
  editing: null,
  activeTab: 'strategy',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (a, n = 4) => (a ? `${a.slice(0, n)}…${a.slice(-n)}` : '—');

/** A real Solana address is base58 and 32-44 chars. Demo placeholders are not. */
const isRealAddress = (a) => typeof a === 'string' && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);
const fmtSol = (n, dp = 4) => (n === null || n === undefined || Number.isNaN(n) ? '—' : `${Number(n) >= 0 ? '' : '-'}${Math.abs(Number(n)).toFixed(dp)}`);
const fmtPct = (n, dp = 1) => (n === null || n === undefined || Number.isNaN(n) ? '—' : `${Number(n) >= 0 ? '+' : ''}${Number(n).toFixed(dp)}%`);
const cls = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : 'dim');
const fmtAge = (ms) => {
  if (!ms || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${s % 60}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
};

/* ------------------------------- api ------------------------------- */
/**
 * Re-read the session token.
 *
 * The token is minted per boot, and /api/session-token needs no auth of its own,
 * so this is always safe to call — including while a write is failing.
 */
async function refreshSessionToken() {
  try {
    const r = await fetch('/api/session-token', { cache: 'no-store' });
    if (!r.ok) return null;
    const t = await r.json();
    return t && t.token ? t.token : null;
  } catch { return null; }
}

/**
 * Re-read keystore state.
 *
 * Called when we discover the server has restarted, because a restart re-locks
 * the keystore: the page's copy of that state is then wrong in the other
 * direction and every wallet action would fail with a confusing
 * "keystore_locked" instead of asking for the passphrase.
 */
async function syncKeystoreState() {
  try {
    const r = await fetch('/api/keystore/status', { cache: 'no-store' });
    if (!r.ok) return;
    S.keystore = await r.json();
    renderAll();
  } catch { /* offline; the next action will report it */ }
}

async function api(path, opts = {}) {
  // In the preview there is no server, so every call is answered by the local
  // simulator instead of failing with an HTTP error. A button that does nothing
  // when tapped teaches you nothing about what it is for.
  if (S.demo) return demoApi(path, opts);

  const attempt = (token) => {
    const headers = { 'content-type': 'application/json', ...(opts.headers || {}) };
    if (token) headers['x-session-token'] = token;
    return fetch(path, { ...opts, headers });
  };

  let res = await attempt(S.token);

  /*
   * A server that has restarted rejects the previous run's token with a bare
   * 401, and the page cannot tell that apart from a wrong passphrase. Every
   * write — including Unlock itself — then failed forever until the tab was
   * reloaded by hand: the unlock modal simply sat there, and tapping the button
   * again produced exactly the same error. Fetch the current token and retry
   * once before giving up.
   */
  if (res.status === 401) {
    const fresh = await refreshSessionToken();
    if (fresh && fresh !== S.token) {
      S.token = fresh;
      res = await attempt(fresh);
    }
    // Reaching here means the server was restarted under us, which also
    // re-locked the keystore. Correct the page's view before the user tries
    // anything else.
    syncKeystoreState();
  }

  if (!res.ok) {
    let detail = {};
    try { detail = await res.json(); } catch { /* non-json error body */ }
    if (res.status === 401) {
      throw new Error('The bot restarted, so this page\'s session expired. Reload the page to continue.');
    }
    throw new Error(detail.error || detail.hint || `HTTP ${res.status}`);
  }
  return res.json();
}

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 300);
  }, 4200);
}

async function boot() {
  discoverWallets();
  try {
    const token = await refreshSessionToken();
    if (!token) throw new Error('no api');
    S.token = token;
    const st = await api('/api/status');
    S.status = st.engine;
    S.config = st.global;
    S.presets = st.presets;
    S.keystore = st.keystore;
    await refreshAll();
    connectWs();
    S.connected = true;
    renderAll();
  } catch (err) {
    startDemo();
  }
}

/**
 * Coming back to the tab is the moment to notice the server restarted.
 *
 * The WebSocket reconnects on its own, so live data recovers — but the session
 * token and keystore state do not, and those are exactly what every button
 * needs. One cheap GET each, only when the tab is actually looked at.
 */
function resyncAfterRestart() {
  if (S.demo || !S.token) return;
  syncKeystoreState();
  api('/api/status').then((st) => {
    S.status = st.engine;
    S.keystore = st.keystore;
    S.presets = st.presets;
    renderChips(); renderStats(); renderWallets();
  }).catch(() => { /* the next action will report it */ });
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) resyncAfterRestart();
});
window.addEventListener('focus', resyncAfterRestart);

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  try {
    S.ws = new WebSocket(`${proto}://${location.host}/ws`);
  } catch { return; }

  S.ws.onopen = () => { S.connected = true; renderChips(); };

  S.ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleWs(msg);
  };

  S.ws.onclose = () => {
    S.connected = false;
    renderChips();
    setTimeout(connectWs, 3000);
  };
  S.ws.onerror = () => { S.connected = false; renderChips(); };
}

function handleWs(msg) {
  switch (msg.type) {
    case 'snapshot':
      S.status = msg.data.status;
      S.wallets = msg.data.wallets;
      S.positions = msg.data.positions.filter((p) => p.status === 'OPEN');
      S.prices = msg.data.prices || {};
      S.logs = msg.data.logs || [];
      renderAll();
      break;
    case 'tick':
      S.status = msg.data.status;
      mergeWallets(msg.data.wallets);
      S.prices = msg.data.prices || {};
      renderChips(); renderStats(); renderWallets(); renderPositions();
      break;
    case 'log':
      pushLog(msg.data);
      break;
    case 'position':
      upsertPosition(msg.data);
      break;
    case 'exit':
      pushLog({ ts: Date.now(), level: 'trade', message: `Exit: ${msg.data.position.symbol} — ${msg.data.decision.reason}`, wallet: msg.data.position.walletId });
      mergePositionsFromWallet(msg.data.position);
      break;
    case 'wallet':
      mergeWallet(msg.data);
      break;
    case 'status':
      S.status = msg.data; renderChips(); renderStats();
      break;
    case 'adopted':
      toast(`♻ Resumed ${msg.data.symbol || 'a position'} from a previous run`, 'warn');
      break;
    case 'panic':
      toast('🚨 PANIC — all positions liquidated', 'err');
      break;
    case 'error':
      toast(msg.data.error || 'trade failed', 'err');
      break;
    default:
      break;
  }
}

function mergeWallets(list) {
  if (!Array.isArray(list)) return;
  S.wallets = list;
  S.positions = list.flatMap((w) => w.openPositions || []);
}

function mergeWallet(w) {
  const i = S.wallets.findIndex((x) => x.id === (w.id || w.walletId));
  if (i >= 0) S.wallets[i] = w; else S.wallets.push(w);
  renderWallets(); renderStats(); renderPositions();
}

function mergePositionsFromWallet(pos) {
  const i = S.positions.findIndex((p) => p.id === pos.id);
  if (pos.status === 'OPEN') {
    if (i >= 0) S.positions[i] = pos; else S.positions.push(pos);
  } else if (i >= 0) S.positions.splice(i, 1);
  renderPositions(); renderStats();
}

function upsertPosition(pos) {
  mergePositionsFromWallet(pos);
  renderWallets();
}

async function refreshAll() {
  const [wallets, positions, logs] = await Promise.all([
    api('/api/wallets').catch(() => []),
    api('/api/positions').catch(() => []),
    api('/api/logs?limit=200').catch(() => []),
  ]);
  S.wallets = wallets;
  S.positions = positions.filter((p) => p.status === 'OPEN');
  S.history = positions.filter((p) => p.status !== 'OPEN');
  S.logs = logs;
}

function pushLog(rec) {
  S.logs.push(rec);
  if (S.logs.length > 400) S.logs.splice(0, S.logs.length - 400);
  const box = $('log');
  if (!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.insertAdjacentHTML('beforeend', logLine(rec));
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

const logLine = (r) => {
  const t = new Date(r.ts).toISOString().slice(11, 19);
  const w = r.wallet ? `<span class="w">[${esc(typeof r.wallet === 'string' && r.wallet.length > 12 ? r.wallet.slice(0, 10) : r.wallet)}]</span>` : '';
  return `<div class="logline ${r.level}"><span class="t">${t}</span>${w}<span class="m">${esc(r.message)}</span></div>`;
};

/* ------------------------------------------------------------------ *
 * The user's own wallet (used only for funding in and out)
 * ------------------------------------------------------------------ *
 * We speak the Solana Wallet Standard, which every current wallet exposes
 * (Phantom, Solflare, Backpack, Glow, Magic Eden, Coinbase…).
 *
 * We request exactly ONE feature: solana:signTransaction. We hand the wallet
 * raw bytes, the user approves in their own extension, and the signed bytes
 * come back to us to broadcast. We never see their key.
 *
 * There is deliberately no use of signAllTransactions and no use of
 * signMessage anywhere in this file. Those two calls are precisely what a
 * drainer needs, and this project exists because of a site that used them.
 */
const WSOL = {
  wallets: [],
  connected: null, // { wallet, account }
  listeners: [],
};

const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const bytesToB64 = (bytes) => btoa(String.fromCharCode(...bytes));

function onWalletsChanged(fn) { WSOL.listeners.push(fn); }
function emitWalletsChanged() { WSOL.listeners.forEach((f) => { try { f(); } catch { /* ignore */ } }); }
WSOL.listeners.push(() => renderConnect());

/** Standard discovery handshake — wallets register themselves with us. */
function discoverWallets() {
  const found = [];
  const register = (...ws) => {
    let changed = false;
    for (const w of ws || []) {
      if (!w || !w.features) continue;
      // Only wallets that can sign a transaction are useful here.
      if (!w.features['solana:signTransaction']) continue;
      if (found.some((x) => x.name === w.name)) continue;
      found.push(w);
      changed = true;
    }
    if (changed) { WSOL.wallets = found; emitWalletsChanged(); }
  };

  window.addEventListener('wallet-standard:register-wallet', (e) => {
    try { e.detail({ register }); } catch { /* ignore */ }
  });
  const poke = () => window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: { register } }));
  poke();
  setTimeout(poke, 900); // some extensions register a beat late
}

async function connectWallet(w) {
  const feat = w.features['standard:connect'];
  if (!feat) throw new Error(`${w.name} does not support connecting`);
  const out = await feat.connect();
  const account = (out && out.accounts && out.accounts[0]) || (w.accounts && w.accounts[0]);
  if (!account) throw new Error(`${w.name} connected but exposed no account`);
  WSOL.connected = { wallet: w, account };
  emitWalletsChanged();
  return account;
}

function disconnectWallet() {
  const c = WSOL.connected;
  WSOL.connected = null;
  emitWalletsChanged();
  try { c?.wallet?.features['standard:disconnect']?.disconnect?.(); } catch { /* ignore */ }
}

/**
 * Build → sign in the user's wallet → broadcast.
 * The only thing we ever ask their wallet to sign is a transfer we authored.
 */
async function fundFromConnectedWallet(walletId, amountSol) {
  if (S.demo) {
    // The same two-step handshake the real flow uses — intent, then submit — so
    // the UI exercises an identical code path against the simulator.
    const intent = await api('/api/fund/intent', {
      method: 'POST',
      body: JSON.stringify({ walletId, amountSol, from: 'demo' }),
    });
    await new Promise((r) => setTimeout(r, 450));
    return api('/api/fund/submit', {
      method: 'POST',
      body: JSON.stringify({ walletId, intentId: intent.intentId, amountSol }),
    });
  }

  const conn = WSOL.connected;
  if (!conn) throw new Error('Connect your wallet first');

  const intent = await api('/api/fund/intent', {
    method: 'POST',
    body: JSON.stringify({ walletId, amountSol, from: conn.account.address }),
  });

  const signer = conn.wallet.features['solana:signTransaction'];
  const outputs = await signer.signTransaction({
    transaction: b64ToBytes(intent.txBase64),
    account: conn.account,
    chain: 'solana:mainnet',
  });
  const signed = outputs && outputs[0] && outputs[0].signedTransaction;
  if (!signed) throw new Error('Your wallet returned no signed transaction');

  const res = await api('/api/fund/submit', {
    method: 'POST',
    body: JSON.stringify({ intentId: intent.intentId, txBase64: bytesToB64(signed) }),
  });
  return res;
}

/* --------------------------- Keystore gating --------------------------- */

/** Single source of truth. `undefined` means not loaded yet — treat as locked. */
function isKeystoreUnlocked() {
  return Boolean(S.keystore && S.keystore.unlocked);
}

/**
 * The ONE place that answers "is there a keystore, and is it open?".
 *
 * Anything that words a passphrase field differently ("choose one" vs. "type the
 * one you set") asks this. Do not re-derive it locally: a local `const` exists
 * only in the function that declares it, so re-deriving it in two places and
 * using one from the other throws `x is not defined` at runtime — which parses
 * fine, greps fine, and passes every test that talks to the API instead of the
 * DOM.
 *
 *   exists  a keystore file has been created at some point
 *   open    unlocked for this session (keys are readable)
 *   locked  exists && !open — the bot restarts into exactly this state
 *   isNew   nothing exists yet, so the passphrase entered now CREATES it
 */
function keystoreState() {
  const exists = Boolean(S.keystore && S.keystore.initialised);
  const open = isKeystoreUnlocked();
  return { exists, open, locked: exists && !open, isNew: !exists };
}

/**
 * Run `action` once the keystore is unlocked, prompting for the passphrase first
 * if needed. Stops wallet actions from dead-ending in the state the bot boots in.
 */
/**
 * Explain the offline preview rather than offering a form that can only fail.
 *
 * The dashboard is served from a static file in preview mode, so a POST here
 * hits a file host and comes back as a bare HTTP 405 — which looks like a bug in
 * the bot and is not. Saying so plainly is the honest answer, and it also tells
 * the user where the real thing lives.
 */
function openPreviewNotice() { openOfflineNotice('use this dashboard for real'); }

function openOfflineNotice(what) {
  openModal(`
    <div class="modal" style="max-width:560px">
      <div class="modal-head"><span class="modal-title">🔌 Offline preview</span>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button></div>
      <div class="modal-body">
        <div class="notice warn"><span class="ico">⚠</span><div>
          <b>There is no bot behind this page.</b>
          This copy of the dashboard is a static file, so nothing you submit here can reach a
          keystore or a wallet. That is also why actions fail with an HTTP error — the request is
          being answered by a file server, not by MEME SNIPER.
        </div></div>
        <div class="section-label">To actually ${esc(what)}</div>
        <div class="hint" style="line-height:1.9">
          1 · Start the bot on your machine:<br/>
          <code class="mono">npm start</code><br/><br/>
          2 · Open the terminal it prints:<br/>
          <code class="mono">http://localhost:8787/terminal</code><br/><br/>
          3 · Unlock the keystore in that tab, then ${esc(what)}.
        </div>
        <div class="notice info" style="margin-top:14px"><span class="ico">ℹ</span><div>
          The numbers on this page are <b>sample data</b>, not your wallets. Nothing here can
          spend or hold funds.
        </div></div>
      </div>
      <div class="modal-foot"><button class="btn btn-block" onclick="closeModal()">Close</button></div>
    </div>`);
}

/**
 * Run `action` once the keystore is open, offering the passphrase first when it
 * is not.
 *
 * Wording rule, because it caused real confusion: this prompts about the KEYSTORE
 * (the file holding your keys), never about "unlocking a wallet". A wallet is
 * created, funded, started and killed; a keystore is opened.
 */
function promptUnlockThen(action, why = 'continue') {
  if (isKeystoreUnlocked()) { action(); return; }

  const init = !(S.keystore && S.keystore.initialised);
  openModal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-head"><span class="modal-title">🔐 ${init ? 'Choose a passphrase for your wallet keys' : 'Keystore passphrase'}</span>
        <button class="btn btn-ghost btn-sm" id="ulCancel">Cancel</button></div>
      <div class="modal-body">
        <div class="notice info"><span class="ico">ℹ</span><div>
          <b>This is your keystore, not a wallet.</b><br/>
          One encrypted file holds the keys to every wallet you make. It re-locks itself whenever
          the bot restarts, so this is asked for once each session. ${esc(why)} continues
          automatically straight after.
        </div></div>
        <label class="fl-label">${init ? 'Choose a passphrase' : 'Passphrase'}</label>
        <input type="password" id="ulPass" class="inp"
               placeholder="${init ? 'New passphrase (at least 8 characters)' : 'Your passphrase'}"
               autocomplete="current-password"/>
        ${init ? '<div class="hint">At least 8 characters. There is no recovery if you lose this — put it in a password manager before continuing.</div>' : ''}
        <button class="btn btn-primary" id="ulGo" style="margin-top:14px;width:100%">
          ${init ? 'Create keystore' : 'Continue'}
        </button>
      </div>
    </div>`);

  const submit = async () => {
    const pass = $('ulPass').value;
    if (!pass) return toast('Enter a passphrase', 'warn');
    const btn = $('ulGo');
    btn.disabled = true;
    try {
      const res = await api(init ? '/api/keystore/init' : '/api/keystore/unlock', {
        method: 'POST', body: JSON.stringify({ passphrase: pass }),
      });
      const st = await api('/api/status');
      S.keystore = st.keystore;
      closeModal();
      await refreshAll();
      renderAll();
      toast(res.walletsLoaded ? `Keystore open — ${res.walletsLoaded} wallet(s) loaded` : 'Keystore ready', '');
      action();
    } catch (err) {
      toast(err.message, 'err');
      btn.disabled = false;
    }
  };

  $('ulGo').textContent = init ? 'Create keystore & continue' : 'Continue';
  $('ulGo').addEventListener('click', submit);
  $('ulCancel').addEventListener('click', closeModal);
  $('ulPass').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') submit(); });
  setTimeout(() => { const el = $('ulPass'); if (el) el.focus(); }, 50);
}

/* ------------------------------ Funding UI ------------------------------ */

function renderFundSource(mount, wallet) {
  const conn = WSOL.connected;
  const detected = WSOL.wallets;

  if (conn) {
    mount.innerHTML = `
      <div class="wsol-connected">
        <div>
          <div class="fg-k">Connected wallet</div>
          <div class="wsol-name">${esc(conn.wallet.name)}</div>
          <div class="wsol-addr mono">${esc(conn.account.address)}</div>
        </div>
        <button class="btn btn-sm btn-ghost" id="wsolDisc">Disconnect</button>
      </div>`;
    $('wsolDisc').addEventListener('click', () => { disconnectWallet(); renderFundSource(mount, wallet); });
    return;
  }

  mount.innerHTML = detected.length
    ? `<div class="wsol-pick">
         <div class="hint" style="margin-bottom:8px">Connect your own wallet to fund this trading wallet in one approval.</div>
         ${detected.map((w, i) => `<button class="btn btn-sm" data-wi="${i}">${esc(w.name)}</button>`).join(' ')}
       </div>`
    : `<div class="notice warn"><span class="ico">⚠</span><div>
         <b>No Solana wallet detected in this browser.</b>
         Funding works by connecting a wallet you already own and approving one transfer —
         there is no address to copy.
         <br/><br/>
         Install <b>Phantom</b>, <b>Solflare</b>, <b>Backpack</b> or <b>Magic Eden</b>, then reload
         this page. If the extension is already installed, make sure it is unlocked, then reload.
       </div></div>`;

  mount.querySelectorAll('[data-wi]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      try {
        await connectWallet(detected[Number(btn.dataset.wi)]);
        renderFundSource(mount, wallet);
      } catch (err) {
        toast(err.message, 'err');
      }
    });
  });
}

function openFund(walletId) {
  const w = S.wallets.find((x) => x.id === walletId);
  if (!w) return;

  const real = isRealAddress(w.publicKey);
  const demo = Boolean(S.demo); // no extension and no chain in the preview
  const cfg = w.config || {};
  const maxSize = cfg.buy?.maxAmountSol ?? 0;
  const maxOpen = cfg.buy?.maxConcurrentPositions ?? 1;
  const worstExposure = maxSize * maxOpen;
  const fees = 0.05;
  const suggested = Math.ceil((worstExposure + fees) * 100) / 100;

  let body = !real
    ? `<p class="muted">This is a demo placeholder — not a real address, and not connected to any chain. Start the bot with <code class="mono">npm start</code> and open <code class="mono">http://localhost:8787</code>.</p>`
    : `
      <p class="muted">Swap SOL into this trading wallet from a wallet you already own, or send it
      from anywhere. The bot's private key never leaves this machine.</p>

      <label class="fl-label">1 · Connect the wallet you are funding from</label>
      <div id="fundSource"></div>

      <label class="fl-label">2 · How much to send</label>
      <div class="row-flex">
        <input type="number" id="fundAmt" class="inp" step="0.05" min="0.01" value="${suggested}" />
        <span class="unit">SOL</span>
        <button class="btn btn-sm" id="fundSuggest">Use ${suggested}</button>
      </div>

      <button class="btn btn-primary" id="fundGo" style="margin-top:10px;width:100%">
        💸 Fund ${suggested} SOL
      </button>
      <div class="hint" id="fundGoHint" style="margin-top:8px">
        Your wallet will open and ask you to approve the transfer. Nothing is sent until you confirm it.
      </div>

      <div class="fund-grid">
        <div><div class="fg-k">Current balance</div><div class="fg-v">${fmtSol(w.balanceSol, 4)} SOL</div></div>
        <div><div class="fg-k">Max position</div><div class="fg-v">${maxSize} SOL</div></div>
        <div><div class="fg-k">Max concurrent</div><div class="fg-v">${maxOpen}</div></div>
      </div>

      <div class="fund-suggest">
        <b>~${suggested} SOL</b>
        <span class="muted">= ${maxOpen} × ${maxSize} SOL worst-case exposure (${worstExposure} SOL)
        plus ~${fees} SOL for priority fees and account rent.</span>
      </div>

      <div class="notice warn" style="margin:14px 0 0">
        <span class="ico">⚠</span>
        <div><b>This balance IS your risk.</b> Fund a dedicated hot wallet with only what you can
        afford to lose — never your main wallet. There is no reversal on Solana.</div>
      </div>

      <div class="notice info" style="margin:10px 0 0">
        <span class="ico">ℹ</span>
        <div><b>You do not have to fund it yet.</b> Dry run uses a notional balance tagged
        <span class="paper-tag">PAPER</span>, so you can validate the strategy for free.</div>
      </div>
    `;

  // In the preview there is no wallet extension to connect and nothing to sign,
  // so the same flow runs against the simulator. It stays fully labelled: a
  // simulated transfer is never dressed up as a real one.
  if (demo) {
    body = `
      <div class="notice warn" style="margin:0 0 16px"><span class="ico">⚠</span><div>
        <b>Preview — nothing is real here.</b> There is no wallet extension and no chain in this
        view, so pressing Fund changes a sample balance and nothing else. Remove all doubt by
        running the bot for real: <code class="mono">npm start</code> then
        <code class="mono">/terminal</code>.
      </div></div>

      <label class="fl-label">1 · Connect the wallet you are funding from</label>
      <div class="notice info" style="margin:0 0 14px"><span class="ico">👛</span><div>
        In the real bot this is where Phantom / Solflare / Backpack / Magic Eden is detected and
        offered. A browser preview cannot reach an extension.
      </div></div>

      <label class="fl-label">2 · How much to send</label>
      <div class="row-flex">
        <input type="number" id="fundAmt" class="inp" step="0.05" min="0.01" value="${suggested}" />
        <span class="unit">SOL</span>
        <button class="btn btn-sm" id="fundSuggest">Use ${suggested}</button>
      </div>

      <button class="btn btn-primary" id="fundGo" style="margin-top:10px;width:100%">
        💸 Fund ${suggested} SOL (simulated)
      </button>
      <div class="hint" id="fundGoHint" style="margin-top:8px">
        Simulated transfer — the balance below will change so you can see the flow work.
      </div>

      <div class="fund-grid">
        <div><div class="fg-k">Current balance</div><div class="fg-v">${fmtSol(w.balanceSol, 4)} SOL</div></div>
        <div><div class="fg-k">Max position</div><div class="fg-v">${maxSize} SOL</div></div>
        <div><div class="fg-k">Max concurrent</div><div class="fg-v">${maxOpen}</div></div>
      </div>

      <div class="fund-suggest">
        <b>~${suggested} SOL</b>
        <span class="muted">= ${maxOpen} × ${maxSize} SOL worst-case exposure (${worstExposure} SOL)
        plus ~${fees} SOL for priority fees and account rent.</span>
      </div>

      <div class="notice warn" style="margin:14px 0 0">
        <span class="ico">⚠</span>
        <div><b>This balance IS your risk.</b> When you run it for real, fund a dedicated hot
        wallet with only what you can afford to lose — never your main wallet.</div>
      </div>
    `;
  }

  openModal(`
    <div class="modal" style="max-width:620px">
      <div class="modal-head"><span class="modal-title">💸 Fund ${esc(w.name)}</span>
        <button class="btn btn-ghost btn-sm" id="fundClose">Close</button></div>
      <div class="modal-body">${body}</div>
    </div>`);

  const source = $('fundSource');
  if (source) {
    renderFundSource(source, w);
    onWalletsChanged(() => { renderFundSource(source, w); });
  }

  const amtEl = $('fundAmt');
  const go = $('fundGo');

  const syncButton = () => {
    const a = Number(amtEl.value) || 0;
    if (!go.disabled) go.textContent = a > 0 ? `💸 Fund ${a} SOL` : '💸 Fund';
  };
  amtEl.addEventListener('input', syncButton);

  const sug = $('fundSuggest');
  if (sug) sug.addEventListener('click', () => { amtEl.value = suggested; syncButton(); });
  syncButton();

  if (go) {
    go.addEventListener('click', async () => {
      const amount = Number(amtEl.value);
      if (!(amount > 0)) return toast('Enter an amount', 'warn');
      if (!demo && !WSOL.connected) return toast('Connect your wallet above first', 'warn');
      if (amount > 100) {
        if (!confirm(`You are about to send ${amount} SOL. That is a large amount — are you sure?`)) return;
      }

      go.disabled = true;
      go.textContent = 'Waiting for your wallet…';
      ($('fundGoHint') || {}).textContent = 'Approve the transfer in your wallet extension.';
      try {
        const res = await fundFromConnectedWallet(w.id, amount);
        toast(demo ? `Funded ${amount} SOL (simulated)` : `Funded ${amount} SOL`, '');
        showTx(res.signature, 'Funding transaction');
        closeModal();
        await refreshAll(); renderAll();
      } catch (err) {
        // Rejecting in the wallet is a normal choice, not a failure state.
        const m = String(err.message || err);
        const rejected = /reject|denied|cancel/i.test(m);
        toast(rejected ? 'Cancelled in wallet' : m, rejected ? 'warn' : 'err');
        const hint = $('fundGoHint');
        if (hint) hint.textContent = rejected
          ? 'You cancelled the transfer in your wallet. Nothing was sent.'
          : 'Your wallet will open and ask you to approve the transfer.';
      } finally {
        go.disabled = false;
        syncButton();
      }
    });
  }
}

function openWithdraw(walletId) {
  const w = S.wallets.find((x) => x.id === walletId);
  if (!w) return;

  const demo = Boolean(S.demo);
  const conn = WSOL.connected;
  const destDefault = conn ? conn.account.address : (demo ? 'DEMO-YourWallet-not-a-real-address' : '');

  openModal(`
    <div class="modal" style="max-width:620px">
      <div class="modal-head"><span class="modal-title">🏧 Withdraw from ${esc(w.name)}</span>
        <button class="btn btn-ghost btn-sm" id="wdClose">Close</button></div>
      <div class="modal-body">
        <p class="muted">${demo
          ? 'Preview — this is a simulated withdrawal, so you can see the flow. When you run it for real, withdrawals are <b>never</b> simulated by dry run, because a settings flag must never be able to trap your money.'
          : 'Move SOL out of this trading wallet. This signs for real — <b>withdrawals are not simulated by dry run</b>, because a settings flag must never be able to trap your money.'}</p>

        <label class="fl-label">Send to</label>
        <div class="row-flex">
          <input type="text" id="wdDest" class="inp mono" placeholder="Your wallet address" value="${esc(destDefault)}" />
          ${conn ? '<button class="btn btn-sm" id="wdUseConn">Use connected</button>' : ''}
        </div>
        ${conn || demo ? '' : '<div class="hint">Connect your wallet in the Fund panel to fill this automatically, or paste any Solana address.</div>'}

        <label class="fl-label">Amount</label>
        <div class="row-flex">
          <input type="number" id="wdAmt" class="inp" step="0.05" min="0.001" value="0.5" />
          <span class="unit">SOL</span>
          <button class="btn btn-sm" id="wdMax">Withdraw all</button>
        </div>

        <div id="wdQuote" class="wd-quote"></div>

        <button class="btn btn-danger" id="wdGo" style="margin-top:12px;width:100%">Withdraw</button>
      </div>
    </div>`);

  let mode = 'custom';

  const refreshQuote = async () => {
    const el = $('wdQuote');
    el.innerHTML = '<div class="muted" style="padding:10px 0">Reading balance…</div>';
    try {
      const qs = mode === 'all'
        ? 'mode=all'
        : `amountSol=${encodeURIComponent($('wdAmt').value || 0)}`;
      const q = await api(`/api/wallets/${w.id}/withdraw/quote?${qs}`);
      const warn = q.warnings.length
        ? `<div class="wd-warn">${q.warnings.map((x) => `<div>⚠ ${esc(x)}</div>`).join('')}</div>` : '';
      el.innerHTML = `
        <div class="wd-rows">
          <div><span>Wallet balance</span><b>${fmtSol(q.balanceSol, 4)} SOL</b></div>
          <div><span>You receive</span><b>${fmtSol(q.amountSol, 4)} SOL</b></div>
          <div><span>Network fee</span><b>${fmtSol(q.feeSol, 6)} SOL</b></div>
          ${q.rentReserveSol ? `<div><span>Kept for rent-exempt</span><b>${fmtSol(q.rentReserveSol, 6)} SOL</b></div>` : ''}
          <div><span>Balance after</span><b>${fmtSol(q.resultingBalanceSol, 4)} SOL</b></div>
          <div><span>Max withdrawable</span><b>${fmtSol(q.maxWithdrawableSol, 4)} SOL</b></div>
        </div>
        ${warn}`;
    } catch (err) {
      el.innerHTML = `<div class="wd-warn">⚠ ${esc(err.message)}</div>`;
    }
  };

  if ($('wdUseConn')) $('wdUseConn').addEventListener('click', () => { $('wdDest').value = conn.account.address; });
  $('wdAmt').addEventListener('input', () => { mode = 'custom'; });
  $('wdMax').addEventListener('click', () => {
    mode = 'all';
    $('wdAmt').value = '';
    refreshQuote();
  });
  $('wdAmt').addEventListener('change', refreshQuote);
  refreshQuote();

  $('wdGo').addEventListener('click', async () => {
    const dest = $('wdDest').value.trim();
    if (!dest) return toast('Enter a destination address', 'warn');

    const label = mode === 'all' ? 'ALL remaining SOL' : `${$('wdAmt').value} SOL`;
    if (!confirm(`Send ${label} out of ${w.name} to:\n\n${dest}\n\nThis is a real on-chain transfer and cannot be reversed.`)) return;

    const btn = $('wdGo');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const res = await api(`/api/wallets/${w.id}/withdraw`, {
        method: 'POST',
        body: JSON.stringify({
          destination: dest,
          mode,
          amountSol: Number($('wdAmt').value || 0),
          confirm: 'WITHDRAW',
        }),
      });
      toast(`Withdrew ${res.amountSol} SOL`, '');
      showTx(res.signature, 'Withdrawal');
      closeModal();
      await refreshAll(); renderAll();
    } catch (err) {
      toast(err.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Withdraw';
    }
  });
}

/** Link a confirmed signature to a block explorer so the user can verify it. */
function showTx(signature, label) {
  if (!signature) return;
  const url = `https://solscan.io/tx/${signature}`;
  const root = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${esc(label || 'Transaction')} confirmed ·
    <a href="${url}" target="_blank" rel="noopener"><span class="mono">${esc(short(signature, 6))}</span></a>`;
  root.appendChild(el);
  setTimeout(() => el.remove(), 15000);
}

function renderNotices() {
  const out = [];
  if (S.demo) {
    out.push(`<div class="notice warn"><span class="ico">⚠</span><div>
      <b>Demo mode — this is not a real bot, and these are not real wallets.</b>
      No backend was detected, so every figure below is sample data and each address is an
      unusable placeholder. <b>Never send funds to a demo address.</b>
      Run <code class="mono">npm start</code> and open <code class="mono">http://localhost:8787/terminal</code> for the real thing.
    </div></div>`);
  }
  if (S.status && S.status.dryRun === false) {
    out.push(`<div class="notice danger"><span class="ico">⚠</span><div><b>LIVE TRADING.</b> The engine is armed and will spend real funds. Every wallet below trades with its own independent config.</div></div>`);
  }
  const imported = (S.wallets || []).filter((w) => w.imported);
  if (imported.length) {
    out.push(`<div class="notice warn"><span class="ico">⚠</span><div>
      <b>${imported.length} wallet(s) use a key you imported:</b>
      ${imported.map((w) => esc(w.name)).join(', ')}.
      Imported keys are still hot keys on this machine. If any of these is your main wallet,
      move your savings to a different wallet — a burner is meant to hold only what you can lose.
    </div></div>`);
  }
  const recovered = S.status?.recoveredPositions || 0;
  if (recovered) {
    out.push(`<div class="notice info"><span class="ico">♻</span><div>
      <b>${recovered} position${recovered === 1 ? '' : 's'} resumed after a restart.</b>
      ${recovered === 1 ? 'It was' : 'They were'} found still in the wallet, verified against the on-chain
      balance, and handed back to your normal exit rules — targets and trailing stops included.
    </div></div>`);
  }

  const stuck = (S.wallets || []).filter((w) => w.stats?.paused);
  if (stuck.length) {
    out.push(`<div class="notice warn"><span class="ico">⏸</span><div><b>${stuck.length} wallet(s) paused:</b> ${stuck.map((w) => `${esc(w.name)} — ${esc(w.stats.pauseReason || 'manual')}`).join(' · ')}</div></div>`);
  }
  const lockedNow = (S.wallets || []).filter((w) => w.keyLocked && !w.keyMissing);
  if (lockedNow.length) {
    out.push(`<div class="notice warn"><span class="ico">🔒</span><div>
      <b>${lockedNow.length} wallet${lockedNow.length === 1 ? ' is' : 's are'} locked right now.</b>
      The bot keeps every wallet's private key in one encrypted file (the keystore) and locks it when it
      restarts — that is what stops a stolen copy of the file, or this server, from spending your funds.
      Your wallets are not gone: they are named and listed below. Open the keystore once this session and
      they trade again.
      <br/><br/><button class="btn btn-sm btn-primary" data-keystore="1">🔐 Open keystore</button>
    </div></div>`);
  }

  $('notices').innerHTML = out.join('');
  // The banner is the first thing on the page, so its button is the first useful
  // action available — wire it rather than making the user hunt in the header.
  const nb = $('notices').querySelector('[data-keystore]');
  if (nb) nb.onclick = openKeystore;
}

function renderStats() {
  const ws = S.wallets || [];
  const open = S.positions || [];
  const totalPnl = ws.reduce((a, w) => a + (w.stats?.realisedPnlSol || 0), 0);
  const unrealised = open.reduce((a, p) => a + (p.pnlSol || 0), 0);
  const exposure = ws.reduce((a, w) => a + (w.exposureSol || 0), 0);
  // In dry run the wallet has no real funds; show the notional balance and tag it
  // so a paper number is never mistaken for a real one.
  const paper = ws.some((w) => w.paperTrading);
  const balance = ws.reduce((a, w) => a + (w.paperTrading ? (w.paperBalanceSol || 0) : (w.balanceSol || 0)), 0);
  const wins = ws.reduce((a, w) => a + (w.stats?.wins || 0), 0);
  const losses = ws.reduce((a, w) => a + (w.stats?.losses || 0), 0);
  const winRate = wins + losses > 0 ? (wins / (wins + losses)) * 100 : 0;
  const detected = S.status?.stats?.detected || 0;
  const bought = S.status?.stats?.bought || 0;

  const cards = [
    ['Realised P&L (day)', `${fmtSol(totalPnl)} SOL`, `${ws.filter((w) => w.enabled).length} wallets armed`, cls(totalPnl), cls(totalPnl) === 'pos' ? 'accent' : cls(totalPnl) === 'neg' ? 'red' : ''],
    ['Unrealised', `${fmtSol(unrealised)} SOL`, `${open.length} open`, cls(unrealised), 'blue'],
    ['Win rate', wins + losses ? `${winRate.toFixed(1)}%` : '—', `${wins}W / ${losses}L`, winRate >= 50 ? 'pos' : 'dim', ''],
    ['Exposure', `${fmtSol(exposure, 2)} SOL`, `of ${fmtSol(balance, 2)} balance`, 'dim', 'amber'],
    ['Tokens scanned', detected.toLocaleString(), `${bought} bought · ${detected ? ((bought / detected) * 100).toFixed(1) : '0'}% hit`, 'dim', ''],
  ];

  $('stats').innerHTML = cards.map(([label, value, sub, vcls, accent]) => `
    <div class="stat ${accent}">
      <div class="stat-label">${esc(label)}</div>
      <div class="stat-value ${vcls}">${esc(value)}</div>
      <div class="stat-sub">${esc(sub)}</div>
    </div>`).join('');
}

function renderWallets() {
  const ws = S.wallets || [];
  $('walletCount').textContent = ws.length;

  if (!ws.length) {
    const ks = keystoreState();
    // Three empty states, three different truths, and each one gets the button
    // that actually helps. Do not collapse these into one boolean: the previous
    // version asked "locked?" only, which is false on a first run, so the
    // first-run copy sat in a branch that could never render.
    const empty = !ks.exists
      ? {
          icon: '◈',
          title: 'No wallets yet',
          sub: `Nothing here yet — no wallets, and no passphrase set.<br/><br/>A wallet is a Solana keypair the bot trades with. Your wallets' keys are kept in one encrypted file on this machine, called the keystore, protected by a passphrase you choose. Pick it and your first wallet is created in the same step.`,
        }
      : ks.locked
        ? {
            icon: '🔒',
            title: 'No wallet is missing',
            sub: `You have no wallets yet, and the bot closed the keystore when it restarted.<br/><br/>Your wallets' keys are kept in one encrypted file on this machine, called the keystore, opened by the passphrase you chose the first time you used this bot. Creating your first wallet asks for it once, in the same form.`,
          }
        : {
            icon: '◈',
            title: 'No wallets yet',
            sub: `Add a wallet to give it its own strategy, limits and exit rules.<br/>Each wallet trades independently with a separate config.`,
          };
    $('wallets').innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">${empty.icon}</div>
        <div class="empty-title">${empty.title}</div>
        <div class="empty-sub">${empty.sub}<br/><br/>
          <button class="btn btn-primary btn-sm" id="emptyCreate">Create your first wallet</button>
        </div>
      </div>`;
    // Straight to the create form, which carries its own passphrase field. The
    // keystore modal belongs to the 🔐 Keystore button in the header, for opening
    // a keystore you already have — never in front of "create".
    const cb = $('emptyCreate');
    if (cb) cb.addEventListener('click', () => openWallet(null));
    return;
  }

  $('wallets').innerHTML = ws.map((w) => {
    // A wallet whose key is not loaded. Two different situations, and the
    // difference matters: if the keystore is closed, the key is inside it and
    // opening the keystore brings the wallet back; if the keystore is OPEN and
    // the key is still absent, it is gone (archived by a reset) and no amount of
    // unlocking will restore it.
    if (w.keyLocked) {
      const missing = Boolean(w.keyMissing);
      return `<div class="wallet locked">
        <div class="wallet-top">
          <div style="flex:1;min-width:0">
            <div class="wallet-name">
              ${esc(w.name)}
              <span class="locked-badge" title="${missing ? 'This key is not in your keystore. The bot cannot trade or withdraw this wallet.' : "This wallet's private key is inside your keystore file, which is closed."}">${missing ? '⚠ key not in keystore' : '🔒 key locked'}</span>
            </div>
            <div class="wallet-addr mono" title="${esc(w.publicKey || '')}">${esc((w.publicKey || '').slice(0, 14))}…${esc((w.publicKey || '').slice(-6))}</div>
          </div>
          <span class="wallet-preset">${esc((w.config || {}).preset || 'custom')}</span>
        </div>

        <div class="wallet-locked-note">
          ${missing
            ? `The keystore is open, and this key is <b>not in it</b>. That happens after a keystore
               reset: the wallet record survives, the key does not. The bot cannot trade or withdraw it.
               <b>Anything still at the address above stays on chain</b> — it needs this wallet's private
               key to move, which only the archived keystore file holds. Delete the record if you do not
               need it.`
            : `<b>This wallet is not lost.</b> Its name and address live in the bot's config; its private
               key is inside the keystore file, which the bot locked when it restarted. Open the keystore
               once this session and this wallet trades again, with the same strategy and balance.`}
        </div>

        <div class="wallet-actions">
          <span class="badge sim" style="align-self:center">${missing ? 'no key' : '🔒 closed'}</span>
          <div style="flex:1"></div>
          ${missing
            ? `<button class="btn btn-sm btn-danger" data-delrecord="${esc(w.id)}" title="Remove this wallet record. Its funds stay on chain.">🗑 Delete record</button>`
            : `<button class="btn btn-sm btn-primary" data-keystore="1" title="Open the encrypted file that holds this wallet's key">🔐 Open keystore</button>`}
        </div>
      </div>`;
    }

    const st = w.stats || {};
    const cfg = w.config || {};
    const pnl = st.realisedPnlSol || 0;
    const tiers = cfg.exits?.takeProfitTiers || [];
    const open = w.openPositions || [];
    const filledTiers = open.length ? (open[0].tiers || []).filter((t) => t.filled).length : 0;

    const state = !w.enabled ? 'off' : st.paused ? 'paused' : 'enabled';
    const stateLabel = !w.enabled
      ? 'disabled'
      : st.paused
        ? `stopped · ${esc(st.pauseReason || '')}`

    return `<div class="wallet ${state}">
      <div class="wallet-top">
        <div style="flex:1;min-width:0">
          <div class="wallet-name">
            ${esc(w.name)}
            ${w.imported
              ? '<span class="imported-badge" title="You supplied this key. If it is your main wallet, move your savings off it.">⚠ IMPORTED</span>'
              : '<span class="burner-badge" title="Generated by this bot and funded by you — a true throwaway hot wallet.">🔥 BURNER</span>'}
          </div>
          <button class="btn btn-sm btn-fund" style="margin-top:7px" data-fund="${esc(w.id)}">💸 Fund</button>
        </div>
        <span class="wallet-preset">${esc(cfg.preset || 'custom')}</span>
      </div>

      <div class="wallet-stats">
        <div class="wstat"><div class="wstat-k">${w.paperTrading ? 'Paper bal.' : 'Balance'}</div><div class="wstat-v">${fmtSol(w.paperTrading ? w.paperBalanceSol : w.balanceSol, 3)}${w.paperTrading ? ' <span class="paper-tag">PAPER</span>' : ''}</div></div>
        <div class="wstat"><div class="wstat-k">Realised</div><div class="wstat-v ${cls(pnl)}">${fmtSol(pnl, 3)}</div></div>
        <div class="wstat"><div class="wstat-k">Win rate</div><div class="wstat-v">${(st.wins || 0) + (st.losses || 0) ? `${winRateOf(st).toFixed(0)}%` : '—'}</div><div class="wstat-sub">${st.wins || 0}W / ${st.losses || 0}L</div></div>
        <div class="wstat"><div class="wstat-k">Open</div><div class="wstat-v">${open.length}/${cfg.buy?.maxConcurrentPositions ?? '—'}</div></div>
      </div>

      <div class="tier-track">
        ${tiers.map((t, i) => `<div class="tier-pip ${i < filledTiers ? 'filled' : ''}" title="+${t.gainPct}% → sell ${t.sellPct}%"></div>`).join('') || '<div class="tier-pip"></div>'}
      </div>
      <div class="tier-legend">
        <span>SL ${cfg.exits?.stopLossPct ?? '—'}%</span>
        <span>trail ${cfg.exits?.trailing?.enabled ? `${cfg.exits.trailing.trailPct}%@+${cfg.exits.trailing.activationPct}%` : 'off'}</span>
        <span>limit ${fmtSol(cfg.limits?.dailyLossLimitSol, 2)}</span>
      </div>
